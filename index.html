<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こめ八バイト日誌 大盛り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 縦一列：伝票帯 → 客席 → まな板 → 手元。藍の暖簾の中に米の白と海苔の黒。派手なのは終業のハンコだけ */
  --ai:#1f3b63;
  --ai-deep:#132741;
  --kome:#fbf9f1;
  --nori:#1b1d1a;
  --ume:#d43a45;
  --tamago:#f4b93e;
  --ita:#dcb787;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ai-deep);color:var(--kome);font-family:var(--body);font-weight:700;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--tamago);outline-offset:2px}
button:disabled{cursor:default}
[hidden]{display:none!important}

#app{position:relative;height:100%;max-width:460px;margin:0 auto;background:var(--ai);
  display:flex;flex-direction:column;gap:8px;padding:10px 16px 14px;overflow:hidden auto}

/* 伝票帯 */
.hud{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.hud-day{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#dayLabel{font-family:var(--display);font-size:19px;letter-spacing:.04em}
#clock{font-variant-numeric:tabular-nums;font-size:15px;opacity:.85}
#peak{font-size:11px;background:var(--ume);padding:1px 8px;border-radius:99px}
#muteBtn{font-size:12px;padding:5px 10px;border:1.5px solid rgba(251,249,241,.5);border-radius:99px}
.timebar{grid-column:1/-1;height:8px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.timebar.haspeak{background:linear-gradient(90deg,rgba(0,0,0,.3) 0 50%,rgba(212,58,69,.75) 50% 75%,rgba(0,0,0,.3) 75%)}
.timebar i{display:block;height:100%;width:100%;background:var(--tamago);transform-origin:left;transform:scaleX(0)}
.hud-money{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.hud-money b{font-size:16px}

/* 客席 */
#seats{position:relative;flex:1 1 auto;min-height:186px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;border-radius:12px;padding:4px 4px 6px;
  transition:transform .12s}
.seat:not(:disabled):active{transform:scale(.96)}
.seat.empty{align-self:end;height:60px;justify-content:flex-end;font-size:11px;opacity:.35;
  border-bottom:3px dashed rgba(251,249,241,.6);border-radius:0}
.seat.can{background:rgba(244,185,62,.16);box-shadow:inset 0 0 0 2px var(--tamago)}
.face{width:58px;height:58px}
.face svg{width:100%;height:100%;display:block}
.tags{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:16px}
.tag{font-size:10px;line-height:1.5;padding:0 7px;border-radius:99px;background:var(--tamago);color:var(--nori)}
.tag.rush{background:var(--ume);color:var(--kome)}
.slip{list-style:none;width:100%;background:var(--kome);color:var(--nori);border-radius:4px;padding:5px 6px;
  display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.15;text-align:left;
  border-top:3px dashed rgba(27,29,26,.25)}
.slip li{display:flex;align-items:center;gap:5px}
.slip svg{width:24px;height:23px;flex:none}
.slip .q{width:24px;height:23px;flex:none;display:grid;place-items:center;font-family:var(--display);color:var(--ume)}
.slip small{display:block;font-size:10px;color:var(--ume)}
.slip li.done{opacity:.35;text-decoration:line-through}
.pat{width:100%;height:6px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.pat i{display:block;height:100%;background:var(--tamago)}
.pat.hot i{background:var(--ume)}
.seat.leaving{pointer-events:none;transition:transform .5s,opacity .5s;opacity:0}
.seat.leaving.happy{transform:translateY(-14px)}
.seat.leaving.angry{transform:translateX(18px)}
.pop{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  background:var(--kome);color:var(--nori);font-size:13px;padding:4px 9px;border-radius:99px;
  animation:pop 1.1s ease-out forwards;z-index:2}
.pop.bad{background:var(--ume);color:var(--kome)}
@keyframes pop{0%{opacity:0;margin-top:14px}15%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-10px}}

/* まな板 */
.bench{display:flex;flex-direction:column;gap:4px}
#hint{font-size:14px;min-height:1.4em}
#hint b{color:var(--tamago)}
#board{height:98px;border-radius:14px;background:var(--ita);
  background-image:repeating-linear-gradient(92deg,rgba(120,80,30,.0) 0 22px,rgba(120,80,30,.13) 22px 24px);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.14);display:grid;place-items:center}
#board svg{height:100%;max-width:100%;display:block}
#board.squish svg{animation:squish .22s ease-out}
@keyframes squish{0%{transform:scale(1.12,.8)}60%{transform:scale(.96,1.05)}100%{transform:none}}

/* 手元 */
.hands{display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:7px}
.btn{position:relative;overflow:hidden;flex:1;min-height:46px;padding:5px 6px;border-radius:12px;background:var(--kome);color:var(--nori);
  font-weight:900;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.1;white-space:nowrap}
.btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.36}
.btn.busy:disabled{opacity:.8}
.btn.next{box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 0 3px var(--tamago)}
.btn.big{flex:2.2;min-height:54px;font-size:19px;background:var(--tamago)}
.btn.small{flex:1;font-size:12px;background:transparent;color:var(--kome);box-shadow:inset 0 0 0 1.5px rgba(251,249,241,.55)}
.btn.on{background:var(--nori);color:var(--kome)}
.btn .fillbar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--tamago);opacity:.75}
.btn span,.btn b{position:relative}
.btn .cnt{font-variant-numeric:tabular-nums;font-size:13px;min-width:1.2em;padding:0 4px;border-radius:99px;background:var(--nori);color:var(--kome)}
.btn.on .cnt{background:var(--kome);color:var(--nori)}
#fryRow .btn{min-height:40px;font-size:13px}
#fillings{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
#fillings .btn{min-height:42px;font-size:13px;gap:3px;padding:4px 2px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}

/* かぶせ画面 */
#overlay{position:absolute;inset:0;z-index:5;background:var(--ai);display:flex;flex-direction:column;
  align-items:center;gap:14px;padding:0 16px 24px;overflow-y:auto}
.noren{display:flex;gap:6px;width:100%;justify-content:center;border-top:8px solid var(--nori);flex:none}
.noren span{width:26%;max-width:104px;padding:18px 0 22px;background:var(--kome);color:var(--ai);
  font-family:var(--display);font-size:40px;text-align:center;border-radius:0 0 6px 6px;
  transform-origin:top;animation:sway 3.6s ease-in-out infinite}
.noren span:nth-child(2){animation-delay:.25s;padding-bottom:30px}
.noren span:nth-child(3){animation-delay:.5s}
@keyframes sway{0%,100%{transform:skewX(0)}50%{transform:skewX(-2.5deg)}}
h1{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.06em;text-wrap:balance;text-align:center}
.lead{font-size:14px;text-align:center;max-width:23em;line-height:1.7;font-weight:500}
.paper{width:100%;max-width:380px;background:var(--kome);color:var(--nori);border-radius:6px;padding:14px 16px;
  position:relative;font-size:14px;line-height:1.6;flex:none}
.paper h2{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.08em;
  border-bottom:2px solid var(--nori);padding-bottom:5px;margin-bottom:8px}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:5px}
.steps li{counter-increment:s;display:flex;gap:8px;align-items:baseline}
.steps li::before{content:counter(s);font-family:var(--display);color:var(--ume);width:1.1em;flex:none}
.news{margin-top:10px;padding-top:8px;border-top:1.5px dashed rgba(27,29,26,.35);font-weight:500}
.news b{font-weight:900}
dl.pay{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
dl.pay dd{text-align:right}
dl.pay .sum{border-top:2px solid var(--nori);padding-top:6px;margin-top:3px;font-size:18px;font-weight:900}
.goal{margin-top:10px;padding-top:8px;border-top:1.5px dashed rgba(27,29,26,.35);font-variant-numeric:tabular-nums}
.goal .gbar{height:10px;border-radius:99px;background:rgba(27,29,26,.14);overflow:hidden;margin-top:4px}
.goal .gbar i{display:block;height:100%;background:var(--ume)}
.hanko{position:absolute;right:12px;top:8px;width:72px;height:72px;border-radius:50%;
  border:4px solid var(--ume);color:var(--ume);font-family:var(--display);font-size:38px;
  display:grid;place-items:center;transform:rotate(-12deg);opacity:.92;
  animation:stamp .45s cubic-bezier(.2,1.6,.4,1) .5s both}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.6)}100%{opacity:.92;transform:rotate(-12deg) scale(1)}}
.cta{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;flex:none}
.cta .btn{flex:none}
.shop{list-style:none;display:flex;flex-direction:column;gap:8px}
.shop li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;
  padding-bottom:8px;border-bottom:1.5px dashed rgba(27,29,26,.25)}
.shop li:last-child{border-bottom:0;padding-bottom:0}
.shop strong{font-weight:900}
.shop p{grid-column:1;font-size:12px;font-weight:500;line-height:1.4}
.shop button{grid-column:2;grid-row:1/3;min-width:92px;min-height:40px;padding:4px 10px;border-radius:10px;
  background:var(--nori);color:var(--kome);font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.shop button:disabled{background:transparent;color:var(--nori);box-shadow:inset 0 0 0 1.5px rgba(27,29,26,.4);opacity:.6}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hud-day"><span id="dayLabel">1週目 月曜</span><span id="clock">10:00</span><span id="peak" hidden>昼ピーク</span></div>
    <button id="muteBtn" type="button" aria-pressed="false">音 あり</button>
    <div class="timebar" id="timebar" aria-hidden="true"><i id="timeFill"></i></div>
    <div class="hud-money">
      <span>売上 <b id="sales">0</b> / <span id="target">0</span>円</span>
      <span>れんぞく <b id="combo">0</b>人</span>
    </div>
  </header>

  <section id="seats" aria-label="お客さん">
    <button class="seat empty" type="button" id="seat0" disabled>空席</button>
    <button class="seat empty" type="button" id="seat1" disabled>空席</button>
    <button class="seat empty" type="button" id="seat2" disabled>空席</button>
  </section>

  <section class="bench">
    <p id="hint" aria-live="polite"></p>
    <div id="board"></div>
  </section>

  <section class="hands" aria-label="手元">
    <div class="row">
      <button class="btn" type="button" id="riceBtn" style="flex:2.2"><span>ごはん</span><b class="cnt" id="riceCnt">8</b></button>
      <button class="btn busy" type="button" id="cookBtn" style="flex:1.3"><i class="fillbar"></i><span>炊く</span></button>
      <button class="btn small" type="button" id="trashBtn">やりなおす</button>
    </div>
    <div class="row" id="fryRow" hidden>
      <button class="btn busy" type="button" id="fry-kara" data-f="kara"><i class="fillbar"></i><span>唐揚げを揚げる</span></button>
      <button class="btn busy" type="button" id="fry-ebi" data-f="ebi"><i class="fillbar"></i><span>エビを揚げる</span></button>
    </div>
    <div id="fillings"></div>
    <div class="row">
      <button class="btn big" type="button" id="squeezeBtn">にぎる</button>
      <button class="btn" type="button" id="noriBtn">のりを巻く</button>
    </div>
  </section>

  <div id="overlay"></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const yen = n => Math.round(n).toLocaleString('ja-JP');
const pick = a => a[Math.floor(Math.random() * a.length)];

const FILL = {
  sake:  {name:'鮭',         short:'鮭',       color:'#f0876b', price:180},
  ume:   {name:'梅',         short:'梅',       color:'#c8283c', price:150},
  tuna:  {name:'ツナマヨ',   short:'ツナ',     color:'#f1dfa3', price:170},
  kombu: {name:'昆布',       short:'昆布',     color:'#46552f', price:150},
  shio:  {name:'塩むすび',   short:'塩',       color:null,      price:120},
  mentai:{name:'明太子',     short:'明太',     color:'#ee6a8c', price:220},
  okaka: {name:'おかか',     short:'おかか',   color:'#a06d3b', price:150},
  kara:  {name:'唐揚げ',     short:'唐揚',     color:'#c8862f', price:230, fried:true},
  ebi:   {name:'エビフライ', short:'エビ',     color:'#f29a4a', price:260, fried:true}
};
const FRIED = ['kara','ebi'];
const NEWS = {
  1:'具は<b>鮭・梅・ツナマヨ</b>。2回にぎれば渡せます。ごはんは釜に8杯ぶん。減ってきたら<b>炊く</b>（少し時間がかかります）。',
  2:'<b>昆布</b>が入荷。<b>のりなし</b>を頼むお客さんも来ます。今日から12時台は<b>昼ピーク</b>で混みます。',
  3:'<b>唐揚げ</b>はじめました。<b>揚げる</b>を押して少し待つとできあがり。切らす前に揚げておくこと。',
  4:'具を入れずににぎると<b>塩むすび</b>。<b>2個</b>たのむお客さんも来ます。',
  5:'金曜日。<b>急ぎ</b>の会社員は待てる時間が短いぶん、チップが2倍。終われば週末です。',
  6:'<b>明太子</b>追加。<b>ふんわり</b>（2回）か<b>しっかり</b>（3回）の好みを言うお客さんが来ます。合えばチップ+20円。',
  7:'<b>エビフライ</b>はじめました。唐揚げと同じく、揚げて待ちます。',
  8:'常連のおばあちゃんが来ます。伝票には「いつもの」としか書かれません。',
  9:'<b>おかか</b>追加。<b>3個</b>たのむお客さんが来ます。',
  10:'途中で注文を<b>変える</b>お客さんが来ます。伝票をもう一度見ること。',
  12:'大工の常連さんが来はじめます。こちらも「いつもの」。'
};
const MEMO1 = 'おばあちゃんのいつもの：<b>梅・のりあり・ふんわり</b>';
const MEMO2 = '大工さんのいつもの：<b>唐揚げ2個・のりなし・しっかり</b>';
const COMMENT = {
  '優': ['文句なし。明日もたのむよ。', 'お客さんが「早いね」って言ってたよ。', '手つきが板についてきたね。'],
  '良': ['いい調子。あとは待たせないこと。', 'だいぶ慣れたね。その感じで。', 'わるくない。伝票をよく見てね。'],
  '可': ['まあ、こんな日もある。', 'あせらず一個ずつ。明日がんばろう。', '仕込みを早めに。ピーク前が勝負だよ。']
};
const SHOP = [
  {id:'nori',   name:'のり巻き機',     price:6000, desc:'にぎり終わると自動でのりが巻かれる'},
  {id:'cooker', name:'大きい炊飯器',   price:5000, desc:'ごはん 8杯 → 14杯'},
  {id:'quick',  name:'早炊きモード',   price:4000, desc:'炊き上がりが早くなる'},
  {id:'batch',  name:'大きい揚げかご', price:4000, desc:'一度に揚がる数 3個 → 5個'},
  {id:'fryer2', name:'フライヤー増設', price:7000, desc:'唐揚げとエビフライを同時に揚げられる'},
  {id:'bench',  name:'待合ベンチ',     price:5000, desc:'お客さんが2割長く待ってくれる'}
];
const TREAT = [
  {id:'sento',    name:'銭湯に行く',   price:800,  desc:'来週、お客さんが1割長く待ってくれる'},
  {id:'yakiniku', name:'焼肉を食べる', price:3000, desc:'来週、チップが2倍'}
];
const GOAL = 80000;
const DOW = '月火水木金';
const weekOf = d => Math.ceil(d / 5);
const dayName = d => weekOf(d) + '週目 ' + DOW[(d - 1) % 5] + '曜';

const newBench = () => ({rice:false, fill:null, squeeze:0, nori:false});
const S = {
  phase:'title', day:1, wage:1050, savings:0, up:{}, buff:null, buffWeek:0, own:false, muted:false,
  t:0, sales:0, tips:0, served:0, lost:0, misses:0, combo:0,
  seats:[null,null,null], spawnT:0, bench:newBench(), conf:null,
  rice:8, cookT:0, fry:{kara:{t:0,stock:0}, ebi:{t:0,stock:0}}
};
const buffOn = id => S.buff === id && S.buffWeek === weekOf(S.day);
const riceCap = () => S.up.cooker ? 14 : 8;
const cookTime = () => S.up.quick ? 4.5 : 8;
const FRY_TIME = 6;
const batch = () => S.up.batch ? 5 : 3;

function conf(d){
  const fills = ['sake','ume','tuna'];
  if(d >= 2) fills.push('kombu');
  if(d >= 3) fills.push('kara');
  if(d >= 4) fills.push('shio');
  if(d >= 6) fills.push('mentai');
  if(d >= 7) fills.push('ebi');
  if(d >= 9) fills.push('okaka');
  return {
    fills,
    noNori: d >= 2 ? 0.25 : 0,
    maxItems: d >= 9 ? 3 : d >= 4 ? 2 : 1,
    patience: Math.max(13, 24 - d * 0.8) * (S.up.bench ? 1.2 : 1) * (buffOn('sento') ? 1.1 : 1),
    spawnEvery: Math.max(2.4, 5.5 - d * 0.28),
    dur: d === 1 ? 60 : 75,
    target: Math.min(3600, 800 + d * 180),
    peak: d >= 2, rush: d >= 5, pref: d >= 6, reg: d >= 8, waver: d >= 10, reg2: d >= 12
  };
}

/* ---------- 保存 ---------- */
const KEY = 'onigiri-shift-plus';
const snap = () => ({day:S.day, wage:S.wage, savings:S.savings, up:S.up, buff:S.buff, buffWeek:S.buffWeek, own:S.own});
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(snap())); }catch(e){} }
function apply(d){
  if(!d || !(d.day >= 1)) return;
  S.day = d.day; S.wage = d.wage || 1050; S.savings = d.savings || 0;
  S.up = d.up || {}; S.buff = d.buff || null; S.buffWeek = d.buffWeek || 0; S.own = !!d.own;
}
function load(){ try{ apply(JSON.parse(localStorage.getItem(KEY) || 'null')); }catch(e){} }

/* ---------- 音 ---------- */
let ac = null;
function beep(f, d, when, type){
  if(S.muted) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.09, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + d + 0.02);
  }catch(e){}
}

/* ---------- 絵 ---------- */
const TRI = 'M50 10 Q58 10 63 19 L89 66 Q97 84 78 86 L22 86 Q3 84 11 66 L37 19 Q42 10 50 10 Z';
const NORI = 'M35 60 H65 L67 86 H33 Z';
function triInner(f, nori){
  const col = FILL[f].color;
  return '<path d="' + TRI + '" fill="#fbf9f1" stroke="#d6cfba" stroke-width="2"/>' +
    (col ? '<circle cx="50" cy="38" r="8" fill="' + col + '" stroke="rgba(0,0,0,.28)" stroke-width="1"/>' : '') +
    (nori ? '<path d="' + NORI + '" fill="#1b1d1a"/>' : '');
}
const mini = (f, nori) => '<svg viewBox="0 0 100 96" aria-hidden="true">' + triInner(f, nori) + '</svg>';

function boardSVG(){
  const b = S.bench;
  if(!b.rice) return '<svg viewBox="0 0 200 120" aria-hidden="true"><ellipse cx="100" cy="96" rx="48" ry="12" fill="none" stroke="rgba(27,29,26,.35)" stroke-width="2" stroke-dasharray="6 6"/></svg>';
  const col = b.fill ? FILL[b.fill].color : null;
  if(b.squeeze === 0){
    return '<svg viewBox="0 0 200 120" aria-hidden="true"><ellipse cx="100" cy="86" rx="62" ry="26" fill="#fbf9f1" stroke="#d6cfba" stroke-width="2"/>' +
      (col ? '<circle cx="100" cy="70" r="13" fill="' + col + '" stroke="rgba(0,0,0,.28)" stroke-width="1.5"/>' : '') + '</svg>';
  }
  const sc = [[1.6,.82],[1.36,1.14],[1.25,1.25]][b.squeeze - 1];
  return '<svg viewBox="0 0 200 120" aria-hidden="true"><g transform="translate(100 114) scale(' + sc[0] + ' ' + sc[1] + ') translate(-50 -86)">' +
    triInner(b.fill || 'shio', b.nori) + '</g></svg>';
}

const HAIR = [
  c => '<path d="M20 44 Q20 16 50 16 Q80 16 80 44 Q65 30 50 32 Q35 30 20 44 Z" fill="' + c + '"/>',
  c => '<path d="M19 62 Q14 16 50 16 Q86 16 81 62 L76 62 Q78 34 50 32 Q22 34 24 62 Z" fill="' + c + '"/>',
  c => '<path d="M24 36 Q30 18 50 18 Q70 18 76 36 Q50 26 24 36 Z" fill="' + c + '"/>',
  c => '<circle cx="50" cy="13" r="9" fill="' + c + '"/><path d="M20 44 Q20 16 50 16 Q80 16 80 44 Q65 30 50 32 Q35 30 20 44 Z" fill="' + c + '"/>'
];
function faceSVG(c){
  const m = c.leaving === 'happy' ? 'joy' : c.leaving === 'angry' ? 'angry' : c.mood;
  const st = 'fill="none" stroke="#1b1d1a" stroke-width="3" stroke-linecap="round"';
  const mouth = m === 'joy' ? '<path d="M37 57 Q50 74 63 57 Z" fill="#7a2e2e"/>'
    : m === 'happy' ? '<path d="M39 59 Q50 68 61 59" ' + st + '/>'
    : m === 'flat' ? '<path d="M41 62 H59" ' + st + '/>'
    : '<path d="M39 66 Q50 57 61 66" ' + st + '/>';
  const brows = m === 'angry' ? '<path d="M33 39 L44 43 M67 39 L56 43" ' + st + '/>' : '';
  const tie = c.kind === 'rush' ? '<path d="M46 78 H54 L57 100 H43 Z" fill="#d43a45"/>' : '';
  return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
    '<path d="M12 100 Q12 76 50 76 Q88 76 88 100 Z" fill="' + c.cloth + '"/>' + tie +
    '<circle cx="50" cy="48" r="30" fill="' + c.skin + '"/>' + HAIR[c.hair](c.hairCol) +
    '<circle cx="40" cy="49" r="3.2" fill="#1b1d1a"/><circle cx="60" cy="49" r="3.2" fill="#1b1d1a"/>' +
    brows + mouth + '</svg>';
}

/* ---------- 客席 ---------- */
const seatEls = [$('seat0'), $('seat1'), $('seat2')];
const seatsEl = $('seats');
const PREF = {soft:'ふんわり', firm:'しっかり'};

function spawn(i){
  const cf = S.conf;
  const has = k => S.seats.some(c => c && c.kind === k);
  let x = Math.random();
  const take = (on, p) => { if(!on) return false; if(x < p) return true; x -= p; return false; };
  const kind = take(cf.reg && !has('reg'), 0.12) ? 'reg'
    : take(cf.reg2 && !has('reg2'), 0.1) ? 'reg2'
    : take(cf.rush, 0.18) ? 'rush'
    : take(cf.waver, 0.12) ? 'waver' : 'normal';
  let items = [], pref = null, look;
  if(kind === 'reg'){
    items = [{f:'ume', nori:true, done:false}]; pref = 'soft';
    look = {hair:3, hairCol:'#b9b9b2', skin:'#f6d3b3', cloth:'#c98bb3'};
  }else if(kind === 'reg2'){
    items = [{f:'kara', nori:false, done:false}, {f:'kara', nori:false, done:false}]; pref = 'firm';
    look = {hair:2, hairCol:'#1b1d1a', skin:'#eec39a', cloth:'#6aa27a'};
  }else{
    const n = kind === 'rush' || cf.maxItems === 1 ? 1 : (Math.random() < 0.55 ? 1 : 1 + Math.ceil(Math.random() * (cf.maxItems - 1)));
    for(let k = 0; k < n; k++) items.push({f: pick(cf.fills), nori: Math.random() >= cf.noNori, done:false});
    if(cf.pref && Math.random() < 0.3) pref = pick(['soft','firm']);
    look = {
      hair: Math.floor(Math.random() * 3),
      hairCol: pick(['#1b1d1a','#5a3d2b','#8f8f8a','#b5651d']),
      skin: pick(['#f6d3b3','#eec39a','#f9dcc4']),
      cloth: kind === 'rush' ? '#fbf9f1' : pick(['#d43a45','#f4b93e','#fbf9f1','#8fb4d9'])
    };
  }
  const mult = kind === 'rush' ? 0.55 : kind === 'reg' || kind === 'reg2' ? 1.3 : 1;
  const max = cf.patience * (1 + 0.6 * (items.length - 1)) * mult;
  S.seats[i] = Object.assign({kind, items, pref, masked: kind === 'reg' || kind === 'reg2',
    t:max, max, mood:'happy', leaving:null, leaveT:0, changed:false, prefBonus:0}, look);
  renderSeat(i);
  beep(520, 0.07);
}
function renderSeat(i){
  const el = seatEls[i], c = S.seats[i];
  if(!c){
    el.className = 'seat empty'; el.disabled = true; el.textContent = '空席';
    el.removeAttribute('aria-label'); return;
  }
  el.disabled = !!c.leaving;
  el.className = 'seat' + (c.leaving ? ' leaving ' + c.leaving : '');
  const tags = (c.kind === 'rush' ? '<span class="tag rush">急ぎ</span>' : '') +
    (c.masked ? '<span class="tag">常連</span>' : c.pref ? '<span class="tag">' + PREF[c.pref] + '</span>' : '');
  el.setAttribute('aria-label', '注文 ' + c.items.map(it => (c.masked && !it.done ? 'いつもの' : FILL[it.f].name + (it.nori ? '' : ' のりなし')) + (it.done ? ' 済' : '')).join('、') + '。タップで渡す');
  el.innerHTML = '<div class="face">' + faceSVG(c) + '</div><div class="tags">' + tags + '</div><ul class="slip">' +
    c.items.map(it => {
      if(c.masked && !it.done) return '<li><span class="q">？</span><span>いつもの</span></li>';
      return '<li class="' + (it.done ? 'done' : '') + '">' + mini(it.f, it.nori) +
        '<span>' + FILL[it.f].name + (it.nori ? '' : '<small>のりなし</small>') + '</span></li>';
    }).join('') +
    '</ul><div class="pat' + (c.mood === 'angry' ? ' hot' : '') + '"><i></i></div>';
  c.bar = el.querySelector('.pat i');
  c.bar.style.width = Math.max(0, c.t / c.max * 100) + '%';
  markSeats();
}
function markSeats(){
  const ready = S.bench.squeeze >= 2;
  seatEls.forEach((el, i) => {
    const c = S.seats[i];
    el.classList.toggle('can', !!(ready && c && !c.leaving));
  });
}
function pop(i, text, bad){
  const p = document.createElement('div');
  p.className = 'pop' + (bad ? ' bad' : '');
  p.textContent = text;
  p.style.left = (i * 33.333 + 16.666) + '%';
  seatsEl.appendChild(p);
  setTimeout(() => p.remove(), 1100);
}
function leave(i, how){
  const c = S.seats[i];
  c.leaving = how; c.leaveT = 0.55;
  renderSeat(i);
  const el = seatEls[i];
  el.classList.remove('leaving');
  void el.offsetWidth;
  el.classList.add('leaving');
}

function deliver(i){
  const c = S.seats[i], b = S.bench;
  if(S.phase !== 'play' || !c || c.leaving) return;
  if(b.squeeze < 2){ flashHint(b.rice ? 'まだにぎれていません' : 'まず ごはんをよそう'); beep(200, 0.08, 0, 'square'); return; }
  const key = b.fill || 'shio';
  const it = c.items.find(x => !x.done && x.f === key && x.nori === b.nori);
  const firm = b.squeeze === 3;
  S.bench = newBench();
  if(!it){
    S.misses++; S.combo = 0;
    c.t -= c.max * 0.2;
    pop(i, 'それ ちがうよ', true);
    beep(170, 0.18, 0, 'square');
    renderBench(); updateHud();
    return;
  }
  it.done = true;
  S.sales += FILL[key].price;
  const fit = c.pref && (c.pref === 'firm') === firm;
  if(fit) c.prefBonus += 20;
  if(c.items.every(x => x.done)){
    const r = c.t / c.max;
    let tip = r > 0.75 ? 50 : r > 0.5 ? 30 : 0;
    if(c.kind === 'rush') tip *= 2;
    S.combo++; S.served++;
    if(S.combo >= 3) tip += 20;
    tip += c.prefBonus;
    if(buffOn('yakiniku')) tip *= 2;
    S.tips += tip;
    pop(i, (fit ? '好みぴったり！' : tip ? 'ありがとう！' : 'どうも') + (tip ? ' +' + tip + '円' : ''));
    beep(660, 0.09); beep(880, 0.14, 0.09);
    leave(i, 'happy');
  }else{
    pop(i, 'あと ' + c.items.filter(x => !x.done).length + '個');
    beep(660, 0.09);
    renderSeat(i);
  }
  renderBench(); updateHud();
}
seatEls.forEach((el, i) => el.addEventListener('click', () => deliver(i)));

/* ---------- まな板と手元 ---------- */
const board = $('board'), hint = $('hint');
const riceBtn = $('riceBtn'), cookBtn = $('cookBtn'), trashBtn = $('trashBtn'), squeezeBtn = $('squeezeBtn'), noriBtn = $('noriBtn');
const fillBox = $('fillings'), fryRow = $('fryRow');
const fryBtns = {kara:$('fry-kara'), ebi:$('fry-ebi')};
let hintFlash = 0;

function buildFillings(){
  fillBox.innerHTML = S.conf.fills.filter(f => f !== 'shio').map(f =>
    '<button class="btn" type="button" id="fill-' + f + '" data-f="' + f + '"><i class="dot" style="background:' + FILL[f].color + '"></i><span>' + FILL[f].short + '</span>' +
    (FILL[f].fried ? '<b class="cnt">0</b>' : '') + '</button>'
  ).join('');
  fryRow.hidden = !S.conf.fills.includes('kara');
  fryBtns.ebi.hidden = !S.conf.fills.includes('ebi');
}
fillBox.addEventListener('click', e => {
  const btn = e.target.closest('button'); if(!btn || btn.disabled) return;
  const b = S.bench;
  b.fill = b.fill === btn.dataset.f ? null : btn.dataset.f;
  beep(440, 0.05); renderBench();
});
riceBtn.addEventListener('click', () => {
  if(S.rice <= 0 || S.bench.rice) return;
  S.rice--; S.bench.rice = true; beep(330, 0.06); renderBench();
});
cookBtn.addEventListener('click', () => {
  if(S.cookT > 0 || S.rice >= riceCap()) return;
  S.cookT = cookTime(); beep(300, 0.08); renderBench();
});
FRIED.forEach(f => fryBtns[f].addEventListener('click', () => {
  const other = f === 'kara' ? 'ebi' : 'kara';
  if(S.fry[f].t > 0 || (!S.up.fryer2 && S.fry[other].t > 0)) return;
  S.fry[f].t = FRY_TIME; beep(360, 0.08); renderBench();
}));
trashBtn.addEventListener('click', () => { S.bench = newBench(); beep(240, 0.06); renderBench(); });
squeezeBtn.addEventListener('click', () => {
  const b = S.bench; if(!b.rice || b.squeeze >= 3) return;
  if(b.squeeze === 0 && b.fill && FILL[b.fill].fried){
    if(S.fry[b.fill].stock <= 0){ b.fill = null; renderBench(); return; }
    S.fry[b.fill].stock--;
  }
  b.squeeze++;
  if(b.squeeze === 2 && S.up.nori) b.nori = true;
  beep(280 + b.squeeze * 70, 0.07);
  renderBench();
  board.classList.remove('squish'); void board.offsetWidth; board.classList.add('squish');
});
noriBtn.addEventListener('click', () => { S.bench.nori = !S.bench.nori; beep(500, 0.05); renderBench(); });

function flashHint(text){
  hint.innerHTML = '<b>' + text + '</b>';
  hintFlash = 1.3;
}
function renderBench(){
  const b = S.bench, play = S.phase === 'play';
  board.innerHTML = boardSVG();
  $('riceCnt').textContent = S.rice;
  riceBtn.disabled = !play || b.rice || S.rice <= 0;
  cookBtn.disabled = !play || S.cookT > 0 || S.rice >= riceCap();
  cookBtn.querySelector('span').textContent = S.cookT > 0 ? '炊飯中' : '炊く';
  cookBtn.classList.toggle('next', play && S.cookT <= 0 && S.rice <= 2);
  FRIED.forEach(f => {
    const fr = S.fry[f], other = S.fry[f === 'kara' ? 'ebi' : 'kara'], el = fryBtns[f];
    el.disabled = !play || fr.t > 0 || (!S.up.fryer2 && other.t > 0);
    el.querySelector('span').textContent = fr.t > 0 ? FILL[f].short + ' 揚げ中' : (f === 'kara' ? '唐揚げを揚げる' : 'エビを揚げる');
    el.classList.toggle('next', play && !el.disabled && fr.stock === 0 && S.conf.fills.includes(f));
  });
  trashBtn.disabled = !play || !b.rice;
  squeezeBtn.disabled = !play || !b.rice || b.squeeze >= 3;
  noriBtn.disabled = !play || b.squeeze < 2;
  noriBtn.classList.toggle('on', b.nori);
  noriBtn.textContent = b.nori ? 'のりを外す' : 'のりを巻く';
  squeezeBtn.textContent = !b.rice || b.squeeze === 0 || b.squeeze === 3 ? 'にぎる' : b.squeeze === 1 ? 'にぎる あと1回' : 'もう1回でしっかり';
  fillBox.querySelectorAll('button').forEach(el => {
    const f = el.dataset.f, fried = FILL[f].fried;
    if(fried) el.querySelector('.cnt').textContent = S.fry[f].stock;
    el.disabled = !play || !b.rice || b.squeeze > 0 || (fried && S.fry[f].stock <= 0);
    el.classList.toggle('on', b.fill === f);
    el.classList.toggle('next', play && !el.disabled && b.squeeze === 0 && !b.fill);
  });
  riceBtn.classList.toggle('next', play && !riceBtn.disabled);
  squeezeBtn.classList.toggle('next', play && b.rice && b.squeeze < 2 && (b.fill || b.squeeze > 0));
  noriBtn.classList.toggle('next', play && b.squeeze >= 2 && !b.nori && !S.up.nori);
  if(hintFlash <= 0) hint.innerHTML = hintText();
  markSeats();
}
function hintText(){
  const b = S.bench;
  if(S.phase !== 'play') return '';
  if(!b.rice){
    if(S.rice <= 0) return S.cookT > 0 ? 'ごはんが炊けるのを待つ' : '<b>ごはんが空。炊く</b>';
    return '伝票を見て、<b>ごはんをよそう</b>';
  }
  if(b.squeeze === 0) return b.fill ? FILL[b.fill].name + 'をのせた。<b>にぎる</b>' : '<b>具をえらぶ</b>' + (S.conf.fills.includes('shio') ? '（なしで塩むすび）' : '');
  if(b.squeeze === 1) return '<b>あと1回</b> にぎる';
  return (b.fill ? FILL[b.fill].name : '塩むすび') + (b.squeeze === 3 ? '・しっかり' : '・ふんわり') + (b.nori ? '・のりあり' : '・のりなし') + '。<b>お客さんをタップ</b>';
}

/* ---------- 進行 ---------- */
const inPeak = fr => S.conf.peak && fr >= 0.5 && fr < 0.75;
function updateHud(){
  $('sales').textContent = yen(S.sales);
  $('combo').textContent = S.combo;
  const fr = Math.min(1, S.t / S.conf.dur);
  $('timeFill').style.transform = 'scaleX(' + fr + ')';
  const min = 600 + Math.floor(fr * 240 / 5) * 5;
  $('clock').textContent = Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0');
  $('peak').hidden = !(S.phase === 'play' && inPeak(fr));
}
function setHeader(){
  $('dayLabel').textContent = dayName(S.day);
  $('target').textContent = yen(S.conf.target);
  $('timebar').classList.toggle('haspeak', S.conf.peak);
}
function startDay(){
  S.conf = conf(S.day);
  Object.assign(S, {phase:'play', t:0, sales:0, tips:0, served:0, lost:0, misses:0, combo:0,
    seats:[null,null,null], spawnT:0.7, bench:newBench(), rice:riceCap(), cookT:0,
    fry:{kara:{t:0, stock:2}, ebi:{t:0, stock:2}}});
  hintFlash = 0;
  setHeader();
  seatsEl.querySelectorAll('.pop').forEach(p => p.remove());
  [0,1,2].forEach(renderSeat);
  buildFillings(); renderBench(); updateHud(); updateBars();
  overlay.hidden = true;
  beep(523, 0.1); beep(784, 0.16, 0.1);
}
function updateBars(){
  cookBtn.querySelector('.fillbar').style.width = S.cookT > 0 ? (1 - S.cookT / cookTime()) * 100 + '%' : '0';
  FRIED.forEach(f => {
    fryBtns[f].querySelector('.fillbar').style.width = S.fry[f].t > 0 ? (1 - S.fry[f].t / FRY_TIME) * 100 + '%' : '0';
  });
}
function tick(dt){
  S.t += dt;
  if(hintFlash > 0){ hintFlash -= dt; if(hintFlash <= 0) hint.innerHTML = hintText(); }
  if(S.t >= S.conf.dur){ endDay(); return; }
  const fr = S.t / S.conf.dur;

  // 仕込み
  if(S.cookT > 0){
    S.cookT -= dt;
    if(S.cookT <= 0){ S.cookT = 0; S.rice = riceCap(); beep(700, 0.1); beep(930, 0.14, 0.1); flashHint('ごはんが炊けた'); renderBench(); }
  }
  FRIED.forEach(f => {
    const x = S.fry[f];
    if(x.t > 0){
      x.t -= dt;
      if(x.t <= 0){ x.t = 0; x.stock += batch(); beep(620, 0.1); flashHint(FILL[f].name + 'が揚がった'); renderBench(); }
    }
  });
  updateBars();

  // 来店
  S.spawnT -= dt;
  if(S.spawnT <= 0){
    const free = [0,1,2].filter(i => !S.seats[i]);
    if(free.length){
      spawn(pick(free));
      S.spawnT = S.conf.spawnEvery * (0.8 + Math.random() * 0.4) * (inPeak(fr) ? 0.55 : 1);
    }else S.spawnT = 0.3;
  }
  S.seats.forEach((c, i) => {
    if(!c) return;
    if(c.leaving){
      c.leaveT -= dt;
      if(c.leaveT <= 0){ S.seats[i] = null; renderSeat(i); }
      return;
    }
    c.t -= dt;
    if(c.t <= 0){
      S.lost++; S.combo = 0;
      pop(i, 'もう行くね…', true);
      beep(150, 0.25, 0, 'sawtooth');
      leave(i, 'angry');
      return;
    }
    const r = c.t / c.max;
    if(c.kind === 'waver' && !c.changed && r < 0.6){
      const it = c.items.find(x => !x.done);
      if(it){
        it.f = pick(S.conf.fills.filter(f => f !== it.f));
        c.changed = true; c.t += 3;
        pop(i, 'やっぱり ' + FILL[it.f].name + ' で', true);
        beep(400, 0.08); beep(300, 0.1, 0.08);
        renderSeat(i);
      }
    }
    c.bar.style.width = (c.t / c.max * 100) + '%';
    const mood = r > 0.5 ? 'happy' : r > 0.25 ? 'flat' : 'angry';
    if(mood !== c.mood){
      c.mood = mood;
      seatEls[i].querySelector('.face').innerHTML = faceSVG(c);
      c.bar.parentNode.classList.toggle('hot', mood === 'angry');
    }
  });
  updateHud();
}

const goalHTML = () => S.own
  ? '<p class="goal">自分の店は開業済み。貯金 ' + yen(S.savings) + '円</p>'
  : '<div class="goal">開業資金　' + yen(S.savings) + ' / ' + yen(GOAL) + '円<div class="gbar"><i style="width:' + Math.min(100, S.savings / GOAL * 100) + '%"></i></div></div>';

function endDay(){
  S.phase = 'result';
  S.seats = [null,null,null]; [0,1,2].forEach(renderSeat);
  S.bench = newBench(); S.cookT = 0; FRIED.forEach(f => { S.fry[f].t = 0; });
  renderBench(); updateBars(); updateHud();
  const cf = S.conf, hit = S.sales >= cf.target;
  const rank = hit && S.lost === 0 && S.misses <= 1 ? '優' : S.sales >= cf.target * 0.7 ? '良' : '可';
  const base = S.wage * 4, bonus = hit ? 500 : 0, total = base + S.tips + bonus;
  const raise = rank === '優' ? 30 : rank === '良' ? 10 : 0;
  const day = S.day, friday = day % 5 === 0;
  S.savings += total; S.wage += raise; S.day++;
  save();
  beep(784, 0.12); beep(988, 0.12, 0.12); beep(1175, 0.25, 0.24);
  showOverlay(
    '<h1 style="margin-top:24px">' + dayName(day) + '<br>おつかれさま</h1>' +
    '<div class="paper"><div class="hanko" role="img" aria-label="店長の評価 ' + rank + '">' + rank + '</div>' +
    '<h2>給与明細</h2><dl class="pay">' +
    '<dt>売上</dt><dd>' + yen(S.sales) + '円</dd>' +
    '<dt>渡せた / 帰られた</dt><dd>' + S.served + '人 / ' + S.lost + '人</dd>' +
    '<dt>渡しまちがい</dt><dd>' + S.misses + '回</dd>' +
    '<dt>時給 ' + yen(S.wage - raise) + '円 × 4時間</dt><dd>' + yen(base) + '円</dd>' +
    '<dt>チップ・手当</dt><dd>' + yen(S.tips) + '円</dd>' +
    '<dt>大入り袋' + (hit ? '' : '（目標 ' + yen(cf.target) + '円）') + '</dt><dd>' + yen(bonus) + '円</dd>' +
    '<dt class="sum">本日の支給</dt><dd class="sum">' + yen(total) + '円</dd></dl>' +
    '<p class="news"><b>店長より</b>　' + pick(COMMENT[rank]) + (raise ? ' 時給を' + raise + '円上げておくよ。' : '') + '</p>' +
    goalHTML() + '</div>' +
    '<div class="cta"><button class="btn big" type="button" id="nextBtn">' + (friday ? '週末へ' : dayName(S.day) + 'へ') + '</button>' +
    '<button class="btn small" type="button" id="retryBtn">この日をやり直す</button></div>'
  );
  $('nextBtn').addEventListener('click', friday ? showWeekend : showIntro);
  $('retryBtn').addEventListener('click', () => {
    S.day = day; S.wage -= raise; S.savings -= total; save(); startDay();
  });
}

/* ---------- かぶせ画面 ---------- */
const overlay = $('overlay');
function showOverlay(html, keepScroll){
  const y = overlay.scrollTop;
  overlay.innerHTML = html; overlay.hidden = false;
  overlay.scrollTop = keepScroll ? y : 0;
}
const NOREN = '<div class="noren" aria-hidden="true"><span>こ</span><span>め</span><span>八</span></div>';
const STEPS = '<ol class="steps"><li>お客さんの伝票を見る</li><li>ごはんをよそって、具をえらぶ</li><li>2回にぎって、のりを巻く</li><li>お客さんをタップして渡す</li></ol>';

function showTitle(){
  S.phase = 'title';
  const cont = S.day > 1;
  showOverlay(NOREN +
    '<h1>こめ八 バイト日誌<br>大盛り</h1>' +
    '<p class="lead">駅前のおむすび屋「こめ八」で月曜から金曜まで働き、週末に休む。開業資金を貯めて、いつか自分の店を持つ。</p>' +
    '<div class="paper"><h2>しごとの流れ</h2>' + STEPS +
    '<p class="news">待たせるとお客さんは帰ってしまいます。早く渡すとチップ。ごはんと揚げものは切らす前に仕込むこと。</p>' +
    goalHTML() + '</div>' +
    '<div class="cta"><button class="btn big" type="button" id="goBtn">' + (cont ? dayName(S.day) + 'からつづける' : '出勤する') + '</button>' +
    (cont ? '<button class="btn small" type="button" id="resetBtn">最初からはじめる</button>' : '') + '</div>');
  const monday = cont && (S.day - 1) % 5 === 0;
  $('goBtn').addEventListener('click', !cont ? startDay : monday ? showWeekend : showIntro);
  if(cont) $('resetBtn').addEventListener('click', () => {
    apply({day:1}); save(); startDay();
  });
}
function showIntro(){
  S.phase = 'intro';
  const d = S.day, cf = conf(d);
  const news = NEWS[d] || '12時台は昼ピーク。その前にごはんと揚げものを用意しておくこと。';
  const memo = (cf.reg ? '<br>' + MEMO1 : '') + (cf.reg2 ? '<br>' + MEMO2 : '');
  const buff = buffOn('sento') ? '<br>銭湯の効果で、今週はお客さんが少し長く待ってくれます。' : buffOn('yakiniku') ? '<br>焼肉の効果で、今週はチップが2倍。' : '';
  showOverlay(NOREN +
    '<h1>' + dayName(d) + '</h1>' +
    '<div class="paper"><h2>本日の申し送り</h2><dl class="pay">' +
    '<dt>時給</dt><dd>' + yen(S.wage) + '円</dd>' +
    '<dt>売上目標</dt><dd>' + yen(cf.target) + '円</dd></dl>' +
    '<p class="news">' + news + memo + buff + '</p>' + goalHTML() + '</div>' +
    '<div class="cta"><button class="btn big" type="button" id="goBtn">出勤する</button></div>');
  $('goBtn').addEventListener('click', startDay);
}
function showWeekend(keep){
  S.phase = 'weekend';
  const treated = S.buffWeek === weekOf(S.day);
  const row = (it, attr, state, can) => '<li><strong>' + it.name + '</strong><p>' + it.desc + '</p>' +
    '<button type="button" ' + attr + '="' + it.id + '"' + (can ? '' : ' disabled') + '>' + state + '</button></li>';
  showOverlay(
    '<h1 style="margin-top:24px">' + (weekOf(S.day) - 1) + '週目の週末</h1>' +
    '<p class="lead">一週間おつかれさま。貯金は <b>' + yen(S.savings) + '円</b>。</p>' +
    '<div class="paper"><h2>夢</h2><ul class="shop">' +
    (S.own ? '<li><strong>自分の店</strong><p>開業済み。屋号は「こめ九」。</p><button type="button" disabled>開業済み</button></li>'
      : row({id:'own', name:'自分の店を開く', desc:'開業資金。貯まったら、のれん分け。'}, 'data-goal', yen(GOAL) + '円', S.savings >= GOAL)) +
    '</ul>' + (S.own ? '' : goalHTML()) + '</div>' +
    '<div class="paper"><h2>道具をそろえる</h2><p style="font-size:12px;font-weight:500;margin-bottom:8px">店長いわく、道具は自分で揃えるのがこめ八流。</p><ul class="shop">' +
    SHOP.map(it => S.up[it.id] ? row(it, 'data-buy', '購入済み', false) : row(it, 'data-buy', yen(it.price) + '円', S.savings >= it.price)).join('') +
    '</ul></div>' +
    '<div class="paper"><h2>ごほうび（週に1つ）</h2><ul class="shop">' +
    TREAT.map(it => treated ? row(it, 'data-treat', S.buff === it.id ? '行ってきた' : 'また今度', false)
      : row(it, 'data-treat', yen(it.price) + '円', S.savings >= it.price)).join('') +
    '</ul></div>' +
    '<div class="cta"><button class="btn big" type="button" id="goBtn">月曜へ</button></div>', keep === true);
  $('goBtn').addEventListener('click', showIntro);
  overlay.querySelectorAll('[data-buy]').forEach(el => el.addEventListener('click', () => {
    const it = SHOP.find(x => x.id === el.dataset.buy);
    if(S.up[it.id] || S.savings < it.price) return;
    S.savings -= it.price; S.up[it.id] = true; save(); beep(660, 0.08); beep(990, 0.14, 0.08); showWeekend(true);
  }));
  overlay.querySelectorAll('[data-treat]').forEach(el => el.addEventListener('click', () => {
    const it = TREAT.find(x => x.id === el.dataset.treat);
    if(S.buffWeek === weekOf(S.day) || S.savings < it.price) return;
    S.savings -= it.price; S.buff = it.id; S.buffWeek = weekOf(S.day); save(); beep(520, 0.1); beep(780, 0.16, 0.1); showWeekend(true);
  }));
  const g = overlay.querySelector('[data-goal]');
  if(g) g.addEventListener('click', () => {
    if(S.own || S.savings < GOAL) return;
    S.savings -= GOAL; S.own = true; save(); showEnding();
  });
}
function showEnding(){
  S.phase = 'ending';
  beep(523, 0.14); beep(659, 0.14, 0.14); beep(784, 0.14, 0.28); beep(1047, 0.4, 0.42);
  showOverlay('<div class="noren" aria-hidden="true"><span>こ</span><span>め</span><span>九</span></div>' +
    '<h1>のれん分け</h1>' +
    '<p class="lead">' + (S.day - 1) + '日のバイトで開業資金が貯まった。店長は新しい暖簾を一枚くれて、「屋号は こめ九 でどうだ」と言った。</p>' +
    '<div class="paper"><h2>店長より</h2><p style="font-weight:500">店が軌道に乗るまで、うちのシフトにも入ってくれると助かるんだが。</p></div>' +
    '<div class="cta"><button class="btn big" type="button" id="goBtn">こめ八のバイトも続ける</button></div>');
  $('goBtn').addEventListener('click', showWeekend);
}

$('muteBtn').addEventListener('click', e => {
  S.muted = !S.muted;
  e.currentTarget.textContent = S.muted ? '音 なし' : '音 あり';
  e.currentTarget.setAttribute('aria-pressed', String(S.muted));
});

/* ---------- 起動 ---------- */
let last = 0;
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if(S.phase === 'play') tick(dt);
  requestAnimationFrame(frame);
}
function start(data){
  load();
  if(data && data.day) apply(data);
  S.conf = conf(S.day);
  S.rice = riceCap();
  setHeader();
  buildFillings(); renderBench(); updateHud();
  showTitle();
  last = performance.now();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(snap);
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
