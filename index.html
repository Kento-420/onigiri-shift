<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こめ八バイト日誌 大盛り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hud-day"><span id="dayLabel">1週目 月曜</span><span id="clock">10:00</span><span id="peak" hidden>昼ピーク</span></div>
    <button id="muteBtn" type="button" aria-pressed="false">音 あり</button>
    <div class="timebar" id="timebar" aria-hidden="true"><i id="timeFill"></i></div>
    <div class="hud-money">
      <span>売上 <b id="sales">0</b> / <span id="target">0</span>円</span>
      <span>れんぞく <b id="combo">0</b>人</span>
    </div>
  </header>

  <section id="seats" aria-label="お客さん">
    <button class="seat empty" type="button" id="seat0" disabled>空席</button>
    <button class="seat empty" type="button" id="seat1" disabled>空席</button>
    <button class="seat empty" type="button" id="seat2" disabled>空席</button>
  </section>

  <section class="bench">
    <p id="hint" aria-live="polite"></p>
    <div id="board"></div>
  </section>

  <section class="hands" aria-label="手元">
    <div class="row">
      <button class="btn" type="button" id="riceBtn" style="flex:2.2"><span>ごはん</span><b class="cnt" id="riceCnt">8</b></button>
      <button class="btn busy" type="button" id="cookBtn" style="flex:1.3"><i class="fillbar"></i><span>炊く</span></button>
      <button class="btn small" type="button" id="trashBtn">やりなおす</button>
    </div>
    <div class="row" id="fryRow">
      <button class="btn" type="button" id="mixBtn"><i class="fillbar"></i><span>ツナを入れる</span></button>
      <button class="btn busy" type="button" id="fry-kara" data-f="kara"><i class="fillbar"></i><span>唐揚げを揚げる</span></button>
      <button class="btn busy" type="button" id="fry-ebi" data-f="ebi"><i class="fillbar"></i><span>エビを揚げる</span></button>
    </div>
    <div id="fillings"></div>
    <div class="row">
      <button class="btn big" type="button" id="squeezeBtn">にぎる</button>
      <button class="btn" type="button" id="noriBtn">のりを巻く</button>
    </div>
  </section>

  <div id="overlay"></div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/seats.js"></script>
<script src="js/bench.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
